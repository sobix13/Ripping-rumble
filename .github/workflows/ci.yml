name: Verify release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python tools/check_release.py
      - run: python -m pytest -q
      - run: python -m rumble.content.validate
      - run: python tools/export_bank.py /tmp/rumble-bank.json
      - run: python tools/simulate.py --games 200
      - run: python tools/verify_experience.py --games 20 --out /tmp/rumble-experience
      - run: for script in scripts/*.sh; do bash -n "$script"; done
